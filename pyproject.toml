[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "nanonis-xarray"
description = "Read a Nanonis spectroscopy .dat file into a xarray Dataset"
readme = "README.md"
keywords = [
    "AFM",
    "Atomic Force Microscopy",
    "Inelastic Electron Tunnelling Spectroscopy",
    "Mimea",
    "Nanonis",
    "Scanning Probe Spectroscopy",
    "Scanning Tunnelling Microscopy",
    "Scanning Tunnelling Spectroscopy",
    "SPECS",
    "SPS",
    "STM",
    "STM-IETS",
    "STS",
    "xarray",
]
license = "MIT"
authors = [ { name = "Angelo Peronio" } ]
# Scientific Python recommendation on versions to support:
# <https://scientific-python.org/specs/spec-0000/>
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    # Wait for NumPy and pandas to publish their compiled wheels
    # for a new Python version before supporting it.
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dynamic = [ "version" ]
# Before attempting stunts here, consider the fragile logic
# for oldest_deps in noxfile.py.
dependencies = [ "numpy>=2.2", "pint-xarray>=0.5", "xarray>=2025.6" ]
urls.Issues = "https://github.com/angelo-peronio/nanonis-xarray/issues"
urls.Repository = "https://github.com/angelo-peronio/nanonis-xarray"
entry-points."xarray.backends".nanonis_dat = """\
    nanonis_xarray.nanonis_dat_backend_entrypoint:NanonisDatBackendEntrypoint\
    """

[dependency-groups]
dev = [
    "bump-my-version",
    "cffconvert",
    "just-lsp",
    "prek",
    "pyproject-fmt",
    "ruff",
    "rumdl",
    "rust-just",
    "ty",
    "zizmor",
    { include-group = "test" },
    { include-group = "docs" },
]
test = [ "nox>=2026.8.10", "packaging", "pytest>9", "pytest-cov" ]
docs = [ "ipykernel", "ipympl", "seaborn" ]

[tool.hatch]
version.source = "vcs"
build.targets.sdist.exclude = [ "/.**", "/scripts", "development.md", "uv.lock" ]

[tool.hatch.version.raw-options]
# Version tag pattern: v[major].[minor].[patch]
# https://setuptools-scm.readthedocs.io/en/latest/config/#setuptools_scm._config.DEFAULT_TAG_REGEX
# Single quote --> literal string, https://toml.io/en/v1.0.0#string
tag_regex = '^(?P<version>v?\d+\.\d+\.\d+)$'
# To be able to publish dev versions to TestPyPI.
# https://github.com/ofek/hatch-vcs/discussions/12
local_scheme = "no-local-version"

[tool.ruff]
lint.extend-select = [ "ALL" ]
lint.ignore = [
    "ANN",    # Type annotations
    "COM812", # Missing trailing comma
    "CPY001", # Missing copyright notice
    "RET504", # Unnecessary assignment
]
lint.extend-per-file-ignores."tests/*.py" = [
    "PLR2004", # Magic value comparison
    "S101",    # Use of assert statement
]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
column_width = 88
indent = 4

[tool.mypy]
files = [ "noxfile.py", "src", "tests" ]
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true

[tool.pytest]
addopts = [ "-ra", "--doctest-glob=README.md", "--showlocals" ]
filterwarnings = [ "error" ]
log_level = "DEBUG"
minversion = "9"
strict = true
testpaths = [ "README.md", "tests" ]

[tool.bumpversion]
tag = true
tag_name = "v{new_version}"
tag_message = "Version v{new_version}"
commit = true

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'date-released: "\d{{4}}-\d{{2}}-\d{{2}}"'
replace = 'date-released: "{utcnow:%Y-%m-%d}"'
regex = true

[tool.rumdl]
global.line-length = 88
# global.extend-disable = [ "line-length" ]
ul-indent.indent = 4
# https://rumdl.dev/md013/
# https://rumdl.dev/md013/#sentence-per-line-without-line-length-warnings
line-length.paragraphs = true  # Do not check paragraphs.
line-length.code-blocks = false  # Do not check code blocks, some of them are meant to be long.
line-length.tables = false
line-length.reflow = true
line-length.reflow-mode = "normalize"
# https://rumdl.dev/md060/
table-format.enabled = true
table-format.style = "aligned"
table-format.column-align = "auto"
